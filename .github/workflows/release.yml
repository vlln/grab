name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build matrix
        run: |
          GOOS=linux GOARCH=amd64 go build -o grab-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o grab-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o grab-darwin-arm64 .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: grab-*
          generate_release_notes: true